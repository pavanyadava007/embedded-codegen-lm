# LoRA fine-tune config — Qwen2.5-Coder-1.5B on embedded C corpus
model_name: "Qwen/Qwen2.5-Coder-1.5B"
dataset_path: "data/processed/embedded_c_dataset"
output_dir: "checkpoints/lora-embedded-c"

# LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

# Training
max_seq_len: 2048
per_device_batch_size: 2
gradient_accumulation_steps: 16      # effective batch = 32
learning_rate: 2.0e-4
warmup_ratio: 0.03
num_epochs: 1
lr_scheduler: "cosine"
bf16: true
gradient_checkpointing: true
logging_steps: 10
save_steps: 500
seed: 42
